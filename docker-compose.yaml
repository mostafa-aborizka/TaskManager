services:
  app:
    build: .
    container_name: task_manager
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/task_manager
      JWT_SECRET: ${JWT_SECRET:-jwt_secret_key}
      NODE_ENV: development
      PORT: 5003
    ports:
      - "5003:5003"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node ./src/server.js"
    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: